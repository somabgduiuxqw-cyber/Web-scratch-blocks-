name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Could not detect Java version"
            exit 1
          fi
          JAVA_MAJOR=$(echo "$JAVA_VER" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "Error: Failed to parse Java major version from '$JAVA_VER'"
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java major version ($JAVA_MAJOR) is lower than 17"
            exit 1
          fi
          echo "Java environment verified: Java $JAVA_MAJOR is 17 or newer."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ -f "./debug.keystore" ]; then
            echo "Confirmed ./debug.keystore exists."
          else
            echo "Error: ./debug.keystore could not be generated."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Expected debug APK not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            echo "Error: Expected debug APK ($EXPECTED_APK) does not exist."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK file $EXPECTED_APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: File $EXPECTED_APK does not have .apk extension."
              exit 1
              ;;
          esac

          echo "Confirmed $EXPECTED_APK exists, is a regular file, is not empty, and has .apk extension."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | sed 's/[^a-zA-Z0-9_-]/-/g')
          RUN_NUM="${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${RUN_NUM}.apk"

          TEMP_DIR=$(mktemp -d -t apk-release-XXXXXX)
          ASSET_PATH="${TEMP_DIR}/${ASSET_NAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_PATH ($ASSET_NAME)"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset $ASSET_PATH does not exist or is empty"
            exit 1
          fi

          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          cat << 'EOF' > release_notes.md
          ## Debug APK Build Details

          - **Type**: Automatically generated debug APK
          - **Builder**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Commit SHA**: ${{ github.sha }}
          - **Purpose**: Intended for testing and verification
          - **Notice**: This is not a Play Store production release
          - **Signing**: Signed only with a temporary debug keystore
          EOF

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file release_notes.md \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "GitHub Release published successfully."
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url)
            RELEASE_TITLE=$(gh release view "$TAG_NAME" --json name -q .name)

            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"

            {
              echo "### 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "**Release Title:** $RELEASE_TITLE"
              echo "**Release Tag:** \`$TAG_NAME\`"
              echo "**Download Page:** [$RELEASE_URL]($RELEASE_URL)"
              echo "**APK File:** \`$ASSET_NAME\`"
              echo ""
              echo "You can download the APK directly from the **Assets** section of the GitHub Release page."
              echo ""
              echo "> **Backup:** The standard GitHub Actions artifact named \`app-debug-apk\` is also available on this workflow run page."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or encountered an error."
            echo "Notice: The debug APK build succeeded and the artifact 'app-debug-apk' was uploaded successfully."

            {
              echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Incomplete)"
              echo ""
              echo "The debug APK was built successfully and uploaded as a GitHub Actions artifact named \`app-debug-apk\`."
              echo ""
              echo "However, GitHub Release publishing could not be completed."
              echo ""
              echo "**Backup Download:** You can download the APK artifact (\`app-debug-apk\`) directly from the Summary section of this GitHub Actions run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
